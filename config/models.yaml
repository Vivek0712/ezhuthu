# All model choices live here. Switch to Claude 5.5 once its Bedrock agreement is accepted.
aws_profile: heisenberg
region: us-east-1
llm:
  default: us.anthropic.claude-sonnet-4-6        # verified invocable 2026-11-02
  escalate: us.anthropic.claude-opus-4-6-v1      # verified invocable 2026-11-02
  cheap: us.anthropic.claude-haiku-4-5-20251001-v1:0
  future_default: us.anthropic.claude-sonnet-5-5 # AccessDenied until agreement accepted
  future_escalate: us.anthropic.claude-opus-5-5
routing:
  # Kept at 0.6 on VAL (issue #26, eval/reports/2026-11-02-val-selection.md): fewest Opus calls within 1 point of the
  # best VAL top-1 (0.6: 36/120; 0.7+: 37/120 with Opus on every gap). The raw top-1 here is the noul-topk:3 decider's
  # P(yes). 96/120 VAL gaps reach Opus by pre-escalation anyway (no parallel >= 50 or > 12 letters).
  escalate_if_confidence_below: 0.6
  escalate_if_gap_chars_over: 12
  escalate_if_no_parallel: true
  abstain_if_confidence_below: 0.5   # used only when no calibration exists for the active decider
# Restorer pipeline knobs (issue #22); eval flags override them per run (python -m ezhuthu.eval.run --help).
restorer:
  # Deployed configuration, chosen on VAL by a pre-registered rule (deployed-config issue,
  # eval/reports/2026-11-02-deployed-config.md): routed Sonnet -> Opus, then the decider-free pre-rank with the
  # character 5-gram's share as a noisy-OR term ("hybrid-prerank"). VAL selection set (280 gaps): 100 matches vs 85
  # routed + self-report, 83 routed + prerank, 92 5-gram gate, 79 5-gram only; hosted v19 choice-topk:3 41 vs 39 on
  # the 120-gap hosted set (p=0.69), so the hosted decider is not used for restoration. The same settings run with and
  # without the decider key (Secrets Manager ezhuthu/decider-api-key): no decider call is made for restoration.
  # Previous settings (issue #26, eval/reports/2026-11-02-val-selection.md; measured on TEST with the local 2B decider
  # only, never deployable as measured): strategy_llm: noul-topk (2B decider noul on the top-3), ngram_prerank: false.
  strategy: self-report     # choice-all | choice-topk | noul-topk | prerank | self-report. Retrieval-only gaps (an LLM call failed): the parallel-agreement heuristic (issue #26: full VAL 0.2619 vs prerank 0.2551, p=0.66)
  strategy_llm: prerank     # once an LLM answered: pre-rank, no decider (was noul-topk)
  ngram_prerank: true       # pre-rank = noisy-OR(LLM probability, parallel support, 5-gram softmax share); tagged prerank-ngram (was false)
  ngram_beam: 20            # 5-gram beam size/width for the proposals and their shares (the 5-gram baseline's)
  ngram_slot: false         # only for top-k decider strategies (show the 5-gram top fill to the decider)
  ngram_gate: null          # 5-gram gate (fill without an LLM when its share >= this): 92 vs 100 on VAL, not used
  top_k: 3                  # decider strategies only: the top-k after the pre-rank (copy-baseline fill always included)
  llm_candidates: 8         # fills asked of the LLM per call (compact JSON: fill + probability only)
  llm_max_tokens: 2048      # ceiling; the budget scales with llm_candidates x gap length
  retry_on_truncation: true # one stricter retry when a reply is cut at max_tokens
  parallels_k: 20           # retrieval depth (the copy-baseline fill is the best length-ok one); 5 go in the prompt
  ngram_k: 3
  calibration: calibration.json   # src/ezhuthu/agent/calibration.json, fitted on the VAL split only
  calibration_min_n: 100          # entries fitted on fewer VAL items are provisional and ignored (raw thresholds)
  calibration_min_positives: 10   # ... or on fewer correct top-1s
decider:
  package: strands-decider==0.2.0
  local: StrandsAgents/strands-decider-E4B-gemma4-v1-2610      # fits 24 GB M4 Pro (mps/mlx), JevBench 187/231
  fast: StrandsAgents/strands-decider-2B-qwen3.5-v1-2610       # reference model
  final_eval_gpu: StrandsAgents/strands-decider-26B-A4B-gemma4-v1-2610
  # Hosted Strands Decider API (decider-cloud staging), used by the cloud runtime with
  # EZHUTHU_DECIDER_BACKEND=hosted. Key 'ezhuthu' lives only in Secrets Manager. Free tier: 10 rpm.
  cloud:
    url: https://da25tnxy06gjk.cloudfront.net
    model: strands-decider-2b-hobson-v19
    secret_name: ezhuthu/decider-api-key
    rpm: 10
    max_input_chars: 8000   # free-tier limit; the client drops tail candidates (keeps 'none') to fit
    max_options: 24         # decider-cloud rejects a choice with more options (422 invalid_request)
  # Fine-tuned restoration deciders (issue #37, eval/reports/2026-11-02-finetuned-decider.md). DISABLED: not used by
  # the restorer or the cloud runtime (no decider call is made for restoration; see restorer: above). Trained on
  # TRAIN only; chosen and calibrated on VAL; TEST scored once. Weights live outside git
  # (/Users/vivekrajaps/tamil-script/ezhuthu-ft/), never published. To try one locally:
  #   strands-decider serve <checkpoint> --device mps --port 8791 --model-name ezhuthu-strands-2b-ft
  #   EZHUTHU_DECIDER_BACKEND=local EZHUTHU_DECIDER_URL=http://127.0.0.1:8791 and restorer.strategy_llm: choice-topk
  finetuned:
    enabled: false
    strands_2b:
      model_name: ezhuthu-strands-2b-ft   # the name it is served under (calibration keys use it)
      base: StrandsAgents/strands-decider-2B-qwen3.5-v1-2610   # rev 216d1ccb (StrandsAgents); Qwen/Qwen3.5-2B-Base (Apache-2.0)
      checkpoint: ezhuthu-ft/strands-2b-ft   # LoRA r48 adapter + pointer head, continue-from; 224 MB
      serve: strands-decider serve (strands-decider[mps]==0.2.0), one request at a time
      strategy: choice-topk
      top_k: 3
    sparrow_tiny:
      model_name: sparrow-tiny-ezhuthu-c3base-v0   # Ettin-32M (JHU, MIT) + pointer head; 12.8 MB
      checkpoint: ezhuthu-ft/sparrow-ft/sparrow-tiny-ezhuthu-c3base-v0.sparrow
      serve: sparrow-decider==0.2.0 --model <file> serve (numpy only)
      strategy: choice-topk
      top_k: 3
# Reader: photo / text-file upload to transcription (POST /api/read, src/ezhuthu/agent/reader.py, issue: Upload + OCR).
# Vision uses llm.default (Sonnet 4.6) and escalates to llm.escalate (Opus 4.6) under
# routing.escalate_if_confidence_below, only while escalate_min_remaining_s of request_budget_s is left (the cloud
# proxy gives AgentCore 27 s per request; see contracts/restore-api.md "POST /api/read"). Every Bedrock call and
# retry back-off is bounded by what is left of request_budget_s. router "opus" needs a one-time reread_token.
reader:
  max_upload_bytes: 5242880      # decoded image bytes after the app's client-side resize (5 MB)
  max_pixels: 40000000           # refuse larger images before decoding (decompression bombs)
  max_long_side: 1568            # server-side downscale before the model (Claude vision's useful maximum)
  jpeg_quality: 88               # re-encoded without EXIF/GPS/XMP/ICC
  max_tokens: 3000
  max_lines: 60
  max_text_bytes: 524288         # .txt / EpiDoc .xml uploads (512 KB)
  request_budget_s: 25            # whole request, both model calls and retries included (proxy timeout is 27 s)
  escalate_min_remaining_s: 15    # Opus vision takes ~10-15 s; start it only with this much budget left
  reread_token_ttl_s: 900         # one-time "read again with Opus" token lifetime
