# All model choices live here. Switch to Claude 5.5 once its Bedrock agreement is accepted.
aws_profile: heisenberg
region: us-east-1
llm:
  default: us.anthropic.claude-sonnet-4-6        # verified invocable 2026-11-02
  escalate: us.anthropic.claude-opus-4-6-v1      # verified invocable 2026-11-02
  cheap: us.anthropic.claude-haiku-4-5-20251001-v1:0
  future_default: us.anthropic.claude-sonnet-5-5 # AccessDenied until agreement accepted
  future_escalate: us.anthropic.claude-opus-5-5
routing:
  escalate_if_confidence_below: 0.6
  escalate_if_gap_chars_over: 12
  escalate_if_no_parallel: true
  abstain_if_confidence_below: 0.5   # used only when no calibration exists for the active decider
# Restorer pipeline knobs (issue #22); eval flags override them per run (python -m ezhuthu.eval.run --help).
restorer:
  strategy: prerank         # choice-all | choice-topk | noul-topk | prerank | self-report. prerank: best retrieval-only VAL top-1, never below copy (eval/reports/2026-11-02-restorer-quality-dev-note.md)
  strategy_llm: self-report # once an LLM answered: the LLM's own probability (prerank halves length-mismatched LLM fills; QA on PR #25)
  top_k: 5                  # decider sees the top-k after a cheap pre-rank (copy-baseline fill always included)
  llm_candidates: 8         # fills asked of the LLM per call (compact JSON: fill + probability only)
  llm_max_tokens: 2048      # ceiling; the budget scales with llm_candidates x gap length
  retry_on_truncation: true # one stricter retry when a reply is cut at max_tokens
  parallels_k: 20           # retrieval depth (the copy-baseline fill is the best length-ok one); 5 go in the prompt
  ngram_k: 3
  calibration: calibration.json   # src/ezhuthu/agent/calibration.json, fitted on the VAL split only
  calibration_min_n: 100          # entries fitted on fewer VAL items are provisional and ignored (raw thresholds)
  calibration_min_positives: 10   # ... or on fewer correct top-1s
decider:
  package: strands-decider==0.2.0
  local: StrandsAgents/strands-decider-E4B-gemma4-v1-2610      # fits 24 GB M4 Pro (mps/mlx), JevBench 187/231
  fast: StrandsAgents/strands-decider-2B-qwen3.5-v1-2610       # reference model
  final_eval_gpu: StrandsAgents/strands-decider-26B-A4B-gemma4-v1-2610
  # Hosted Strands Decider API (decider-cloud staging), used by the cloud runtime with
  # EZHUTHU_DECIDER_BACKEND=hosted. Key 'ezhuthu' lives only in Secrets Manager. Free tier: 10 rpm.
  cloud:
    url: https://da25tnxy06gjk.cloudfront.net
    model: strands-decider-2b-hobson-v19
    secret_name: ezhuthu/decider-api-key
    rpm: 10
    max_input_chars: 8000   # free-tier limit; the client drops tail candidates (keeps 'none') to fit
    max_options: 24         # decider-cloud rejects a choice with more options (422 invalid_request)
# Reader: photo / text-file upload to transcription (POST /api/read, src/ezhuthu/agent/reader.py, issue: Upload + OCR).
# Vision uses llm.default (Sonnet 4.6) and escalates to llm.escalate (Opus 4.6) under
# routing.escalate_if_confidence_below, only if the first read finished within escalate_if_elapsed_below_s
# (the cloud proxy gives AgentCore 27 s per request; see contracts/restore-api.md "POST /api/read").
reader:
  max_upload_bytes: 5242880      # decoded image bytes after the app's client-side resize (5 MB)
  max_pixels: 40000000           # refuse larger images before decoding (decompression bombs)
  max_long_side: 1568            # server-side downscale before the model (Claude vision's useful maximum)
  jpeg_quality: 88               # re-encoded without EXIF/GPS/XMP/ICC
  max_tokens: 3000
  max_lines: 60
  max_text_bytes: 524288         # .txt / EpiDoc .xml uploads (512 KB)
  escalate_if_elapsed_below_s: 10
