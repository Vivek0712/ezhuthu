[project]
name = "ezhuthu"
version = "0.1.0"
description = "AI tutor and restoration engine for ancient Tamil inscriptions, built with Strands Agents"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "strands-agents>=1.63",
  "boto3>=1.40",
  "pyyaml>=6",
  "lxml>=5",
  "rapidfuzz>=3",
  "rank-bm25>=0.2.2",
  "aksharamukha>=2.3",
  "rdflib>=7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "pillow>=11",  # /api/read: decode, size-guard, downscale, strip EXIF/GPS before the vision model
  "mcp>=2.0,<2.4",  # ontology MCP server + agent MCPClient (strands-agents also pins <2.4)
]

[project.optional-dependencies]
decider = ["strands-decider[mps,vision]==0.2.0"]
agentcore = ["bedrock-agentcore>=0.1"]
heic = ["pillow-heif>=0.18"]  # optional: HEIC uploads straight to the API (browsers already send JPEG)
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.15", "httpx>=0.27", "jsonschema>=4",
       "bedrock-agentcore>=0.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ezhuthu.agent" = ["fixtures/*.jsonl", "fixtures/*.json", "fixtures/*.md", "calibration.json"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls AWS Bedrock (needs EZHUTHU_LIVE=1)",
  "network: calls a live local service (e.g. strands-decider serve); deselected in make check",
]
