<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" width="1000" height="980" role="img" aria-label="Restore result · மீட்டமை"><style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&amp;family=Instrument+Sans:wght@400..700&amp;family=Noto+Sans+Tamil:wght@400..700&amp;family=Noto+Serif+Tamil:wght@400..700&amp;family=Noto+Sans+Brahmi&amp;family=Noto+Sans+Grantha&amp;display=block');</style><rect width="1000" height="980" fill="#EFE8DA"/><text x="40" y="34" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="18" font-weight="700" fill="#1D1611" text-anchor="start">Restore result · மீட்டமை</text><text x="960" y="34" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12" font-weight="500" fill="#76674F" text-anchor="end">Ezhuthu · wireframe · mobile 390 × 844</text><rect x="30" y="50" width="410" height="864" rx="54" fill="#2A221B"/><clipPath id="scr"><rect x="40" y="60" width="390" height="844" rx="44"/></clipPath><g clip-path="url(#scr)"><rect x="40" y="60" width="390" height="844" rx="0" fill="#F4EEE2"/><text x="70" y="90" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="600" fill="#1D1611" text-anchor="start">9:41</text><rect x="40" y="108" width="390" height="56" rx="0" fill="#F4EEE2"/><path d="M40 164H430" stroke="#DACDB4"/><text x="60" y="144" font-family="'Noto Serif Tamil', serif" font-size="22" font-weight="700" fill="#1D1611" text-anchor="start">எழுத்து</text><path d="M66 140l5 -9l5 9z" fill="#D2891C" opacity="0"/><rect x="302" y="123" width="70" height="26" rx="13" fill="#EAE1CE"/><text x="337.0" y="141" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="600" fill="#1D1611" text-anchor="middle">English</text><rect x="382" y="120" width="32" height="32" rx="16" fill="#EAE1CE"/><path d="M390 130h16M390 136h16M390 142h16" stroke="#1D1611" stroke-width="2" stroke-linecap="round"/><text x="60" y="200" font-family="'Noto Serif Tamil', serif" font-size="24" font-weight="700" fill="#1D1611" text-anchor="start">மீட்டமை</text><text x="60" y="224" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="500" fill="#564A3A" text-anchor="start">Restore a damaged line</text><rect x="56" y="246" width="358" height="76" rx="14" fill="#FBF8F1" stroke="#DACDB4"/><text x="70" y="276" font-family="'Noto Serif Tamil', serif" font-size="17" font-weight="500" fill="#1D1611" text-anchor="start">…கோப்</text><rect x="132" y="256" width="46" height="30" rx="8" fill="#FBDFA6" stroke="#D2891C" stroke-dasharray="5 4"/><text x="155" y="277" font-family="'Noto Serif Tamil', serif" font-size="17" font-weight="700" fill="#8A5508" text-anchor="middle">பர</text><text x="186" y="276" font-family="'Noto Serif Tamil', serif" font-size="17" font-weight="500" fill="#1D1611" text-anchor="start">கேசரிவர்மற்கு…</text><text x="70" y="306" font-family="'Noto Serif Tamil', serif" font-size="17" font-weight="500" fill="#1D1611" text-anchor="start">ஆண்டு</text><rect x="130" y="288" width="36" height="28" rx="8" fill="#E3E5F4" stroke="#3B4787" stroke-dasharray="5 4"/><text x="148" y="308" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="16" font-weight="700" fill="#3B4787" text-anchor="middle">?</text><text x="174" y="306" font-family="'Noto Serif Tamil', serif" font-size="17" font-weight="500" fill="#1D1611" text-anchor="start">ஆவது</text><rect x="56" y="340" width="358" height="204" rx="16" fill="#FFFDF8" stroke="#DACDB4"/><text x="70" y="368" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="14.5" font-weight="700" fill="#1D1611" text-anchor="start">இடைவெளி 1 · ~4 எழுத்துகள்</text><rect x="340" y="352" width="60" height="26" rx="13" fill="#DEEBD7"/><text x="370.0" y="370" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="600" fill="#2C6534" text-anchor="middle">நிரப்பு</text><rect x="66" y="382" width="338" height="92" rx="12" fill="#FBF8F1" stroke="#2C6534"/><text x="78" y="410" font-family="'Noto Serif Tamil', serif" font-size="20" font-weight="700" fill="#1D1611" text-anchor="start">பர</text><text x="118" y="410" font-family="'Fraunces', 'Noto Serif Tamil', serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start" font-style="italic">para</text><rect x="310" y="394" width="54" height="26" rx="13" fill="#DEEBD7"/><text x="337.0" y="412" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="600" fill="#2C6534" text-anchor="middle">தேர்வு</text><rect x="78.0" y="424" width="23.1" height="8" rx="2" fill="#9B3D22"/><rect x="104.1" y="424" width="23.1" height="8" rx="2" fill="#9B3D22"/><rect x="130.2" y="424" width="23.1" height="8" rx="2" fill="#9B3D22"/><rect x="156.3" y="424" width="23.1" height="8" rx="2" fill="#9B3D22"/><rect x="182.4" y="424" width="23.1" height="8" rx="2" fill="#9B3D22"/><rect x="208.5" y="424" width="23.1" height="8" rx="2" fill="#9B3D22"/><rect x="234.60000000000002" y="424" width="23.1" height="8" rx="2" fill="#9B3D22"/><rect x="260.70000000000005" y="424" width="23.1" height="8" rx="2" fill="#9B3D22"/><rect x="286.8" y="424" width="23.1" height="8" rx="2" fill="#EAE1CE"/><rect x="312.9" y="424" width="23.1" height="8" rx="2" fill="#EAE1CE"/><text x="384" y="433" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12" font-weight="600" fill="#564A3A" text-anchor="end">high</text><rect x="78" y="440" width="112" height="26" rx="13" fill="#EAE1CE"/><text x="134.0" y="458" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="600" fill="#564A3A" text-anchor="middle">title: Parakesari</text><rect x="196" y="440" width="120" height="26" rx="13" fill="#EAE1CE"/><text x="256.0" y="458" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="600" fill="#564A3A" text-anchor="middle">ruler: Parantaka I</text><text x="78" y="500" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="13" font-weight="600" fill="#9B3D22" text-anchor="start">இணைப் பகுதிகள் (1) ▸  Parallels</text><text x="78" y="530" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="500" fill="#76674F" text-anchor="start">+1 lower-confidence candidate</text><rect x="56" y="560" width="358" height="170" rx="16" fill="#E3E5F4" stroke="#3B4787" stroke-dasharray="5 4"/><text x="72" y="590" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B4787" text-anchor="start">இடைவெளி 2</text><rect x="280" y="572" width="122" height="26" rx="13" fill="#FBF8F1"/><text x="341.0" y="590" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="600" fill="#3B4787" text-anchor="middle">விலகல் · abstain</text><text x="72" y="622" font-family="'Noto Serif Tamil', serif" font-size="17" font-weight="700" fill="#1D1611" text-anchor="start">வல்லுநர்களுக்கும் உறுதியில்லை</text><text x="72" y="646" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13.5" font-weight="600" fill="#564A3A" text-anchor="start">Experts are unsure</text><text x="72" y="672" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="12.5" font-weight="500" fill="#1D1611" text-anchor="start">எந்த நிரப்பும் போதுமான உறுதியுடன் இல்லை.</text><text x="72" y="692" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12" font-weight="500" fill="#564A3A" text-anchor="start">This is an honest gap: experts leave it open too.</text><text x="72" y="716" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="600" fill="#3B4787" text-anchor="start">Show candidates anyway ▸</text><text x="56" y="754" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12" font-weight="500" fill="#76674F" text-anchor="start">“Matches expert restorations”, never “correct”.</text><rect x="40" y="826" width="390" height="78" rx="0" fill="#FBF8F1"/><path d="M40 826H430" stroke="#DACDB4"/><circle cx="88.75" cy="850" r="6" fill="none" stroke="#76674F" stroke-width="2"/><text x="88.75" y="882" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="11.5" font-weight="500" fill="#564A3A" text-anchor="middle">கற்க</text><rect x="156.25" y="836" width="60" height="28" rx="14" fill="#F7E0D5"/><circle cx="186.25" cy="850" r="6" fill="#9B3D22" stroke="#9B3D22" stroke-width="2"/><text x="186.25" y="882" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="11.5" font-weight="600" fill="#9B3D22" text-anchor="middle">மீட்டமை</text><circle cx="283.75" cy="850" r="6" fill="none" stroke="#76674F" stroke-width="2"/><text x="283.75" y="882" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="11.5" font-weight="500" fill="#564A3A" text-anchor="middle">முன்னேற்றம்</text><circle cx="381.25" cy="850" r="6" fill="none" stroke="#76674F" stroke-width="2"/><text x="381.25" y="882" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="11.5" font-weight="500" fill="#564A3A" text-anchor="middle">மதிப்பாய்வு</text></g><path d="M414 284H454L486 145" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="414" cy="284" r="4" fill="#D2891C"/><circle cx="500" cy="145" r="12" fill="#D2891C"/><text x="500" y="150" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">1</text><text x="522" y="150" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Restored line, gaps marked in place</text><text x="522" y="170" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Fill = lamp dashed box; abstain = neelam ?</text><text x="522" y="190" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Never colour alone: box style + glyph differ.</text><path d="M404 402H454L486 265" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="404" cy="402" r="4" fill="#D2891C"/><circle cx="500" cy="265" r="12" fill="#D2891C"/><text x="500" y="270" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">2</text><text x="522" y="270" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Candidate row</text><text x="522" y="290" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Text (Tamil) + ISO in italic, 10-step meter,</text><text x="522" y="310" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">verbal band (high / medium / low) beside it.</text><path d="M404 428H454L486 385" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="404" cy="428" r="4" fill="#D2891C"/><circle cx="500" cy="385" r="12" fill="#D2891C"/><text x="500" y="390" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">3</text><text x="522" y="390" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Confidence is banded, not decimal</text><text x="522" y="410" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Show % only in expert mode; learners see</text><text x="522" y="430" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">bands. Thresholds come from the decider.</text><path d="M404 452H454L486 505" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="404" cy="452" r="4" fill="#D2891C"/><circle cx="500" cy="505" r="12" fill="#D2891C"/><text x="500" y="510" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">4</text><text x="522" y="510" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Ontology + parallels</text><text x="522" y="530" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Chips for ruler/title/place; parallels open</text><text x="522" y="550" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">a sheet with DHARMA links.</text><path d="M414 586H454L486 625" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="414" cy="586" r="4" fill="#D2891C"/><circle cx="500" cy="625" r="12" fill="#D2891C"/><text x="500" y="630" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">5</text><text x="522" y="630" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Abstain is a teaching moment</text><text x="522" y="650" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Calm indigo, dashed edge, Tamil headline;</text><text x="522" y="670" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">candidates hidden behind a disclosure.</text></svg>
