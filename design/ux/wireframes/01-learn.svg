<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" width="1000" height="980" role="img" aria-label="Learn · கற்க"><style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&amp;family=Instrument+Sans:wght@400..700&amp;family=Noto+Sans+Tamil:wght@400..700&amp;family=Noto+Serif+Tamil:wght@400..700&amp;family=Noto+Sans+Brahmi&amp;family=Noto+Sans+Grantha&amp;display=block');</style><rect width="1000" height="980" fill="#EFE8DA"/><text x="40" y="34" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="18" font-weight="700" fill="#1D1611" text-anchor="start">Learn · கற்க</text><text x="960" y="34" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12" font-weight="500" fill="#76674F" text-anchor="end">Ezhuthu · wireframe · mobile 390 × 844</text><rect x="30" y="50" width="410" height="864" rx="54" fill="#2A221B"/><clipPath id="scr"><rect x="40" y="60" width="390" height="844" rx="44"/></clipPath><g clip-path="url(#scr)"><rect x="40" y="60" width="390" height="844" rx="0" fill="#F4EEE2"/><text x="70" y="90" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="600" fill="#1D1611" text-anchor="start">9:41</text><rect x="40" y="108" width="390" height="56" rx="0" fill="#F4EEE2"/><path d="M40 164H430" stroke="#DACDB4"/><text x="60" y="144" font-family="'Noto Serif Tamil', serif" font-size="22" font-weight="700" fill="#1D1611" text-anchor="start">எழுத்து</text><path d="M66 140l5 -9l5 9z" fill="#D2891C" opacity="0"/><rect x="302" y="123" width="70" height="26" rx="13" fill="#EAE1CE"/><text x="337.0" y="141" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="600" fill="#1D1611" text-anchor="middle">English</text><rect x="382" y="120" width="32" height="32" rx="16" fill="#EAE1CE"/><path d="M390 130h16M390 136h16M390 142h16" stroke="#1D1611" stroke-width="2" stroke-linecap="round"/><text x="60" y="200" font-family="'Noto Serif Tamil', serif" font-size="24" font-weight="700" fill="#1D1611" text-anchor="start">கற்க</text><text x="60" y="224" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="500" fill="#564A3A" text-anchor="start">Learn to read, one era at a time</text><text x="60" y="250" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="13" font-weight="600" fill="#564A3A" text-anchor="start">நிலையைத் தேர்ந்தெடுங்கள் · Pick a level</text><rect x="56" y="264" width="358" height="82" rx="16" fill="#FFFDF8" stroke="#DACDB4"/><rect x="68" y="275" width="60" height="60" rx="12" fill="#EAE1CE"/><text x="98" y="318" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="30" font-weight="600" fill="#1D1611" text-anchor="middle">க</text><text x="142" y="298" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="16" font-weight="700" fill="#1D1611" text-anchor="start">L1 · இன்றைய தமிழ்</text><text x="142" y="320" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="500" fill="#564A3A" text-anchor="start">Modern Tamil</text><rect x="318" y="292" width="86" height="26" rx="13" fill="#DEEBD7"/><text x="361.0" y="310" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="600" fill="#2C6534" text-anchor="middle">✓ முடிந்தது</text><rect x="56" y="356" width="358" height="82" rx="16" fill="#FBF8F1" stroke="#9B3D22"/><rect x="68" y="367" width="60" height="60" rx="12" fill="#EAE1CE"/><text x="98" y="410" font-family="'Noto Serif Tamil', serif" font-size="30" font-weight="600" fill="#1D1611" text-anchor="middle">க</text><text x="142" y="390" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="16" font-weight="700" fill="#1D1611" text-anchor="start">L2 · சோழர் தமிழ்</text><text x="142" y="412" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="500" fill="#564A3A" text-anchor="start">Chola Tamil</text><rect x="330" y="384" width="72" height="26" rx="13" fill="#9B3D22"/><text x="366.0" y="402" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="600" fill="#FBF8F1" text-anchor="middle">தொடர்க</text><rect x="56" y="448" width="358" height="82" rx="16" fill="#FFFDF8" stroke="#DACDB4"/><rect x="68" y="459" width="60" height="60" rx="12" fill="#EAE1CE"/><text x="98" y="502" font-family="'Noto Sans Grantha', sans-serif" font-size="30" font-weight="600" fill="#1D1611" text-anchor="middle">𑌕</text><text x="142" y="482" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="16" font-weight="700" fill="#1D1611" text-anchor="start">L3 · பல்லவர் தமிழ்</text><text x="142" y="504" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="500" fill="#564A3A" text-anchor="start">Pallava (Grantha)</text><rect x="56" y="540" width="358" height="82" rx="16" fill="#FFFDF8" stroke="#DACDB4"/><rect x="68" y="551" width="60" height="60" rx="12" fill="#F5EACB"/><g transform="translate(76 559) scale(.44)"><path d="M50 13V87M17 47C25 38 39 39 50 50C61 61 75 62 83 53" fill="none" stroke="#1D1611" stroke-width="9" stroke-linecap="round"/></g><text x="142" y="574" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="16" font-weight="700" fill="#1D1611" text-anchor="start">L4 · வட்டெழுத்து</text><text x="142" y="596" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="500" fill="#564A3A" text-anchor="start">Vatteluttu</text><rect x="56" y="632" width="358" height="82" rx="16" fill="#FFFDF8" stroke="#DACDB4"/><rect x="68" y="643" width="60" height="60" rx="12" fill="#EAE1CE"/><text x="98" y="686" font-family="'Noto Sans Brahmi', sans-serif" font-size="30" font-weight="600" fill="#1D1611" text-anchor="middle">𑀓</text><text x="142" y="666" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="16" font-weight="700" fill="#1D1611" text-anchor="start">L5 · தமிழ்-பிராமி</text><text x="142" y="688" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="500" fill="#564A3A" text-anchor="start">Tamil-Brahmi</text><rect x="56" y="730" width="358" height="48" rx="24.0" fill="#9B3D22"/><text x="235.0" y="760.0" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="16" font-weight="600" fill="#FBF8F1" text-anchor="middle">பாடத்தைத் தொடங்கு · Start lesson</text><rect x="40" y="826" width="390" height="78" rx="0" fill="#FBF8F1"/><path d="M40 826H430" stroke="#DACDB4"/><rect x="58.75" y="836" width="60" height="28" rx="14" fill="#F7E0D5"/><circle cx="88.75" cy="850" r="6" fill="#9B3D22" stroke="#9B3D22" stroke-width="2"/><text x="88.75" y="882" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="11.5" font-weight="600" fill="#9B3D22" text-anchor="middle">கற்க</text><circle cx="186.25" cy="850" r="6" fill="none" stroke="#76674F" stroke-width="2"/><text x="186.25" y="882" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="11.5" font-weight="500" fill="#564A3A" text-anchor="middle">மீட்டமை</text><circle cx="283.75" cy="850" r="6" fill="none" stroke="#76674F" stroke-width="2"/><text x="283.75" y="882" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="11.5" font-weight="500" fill="#564A3A" text-anchor="middle">முன்னேற்றம்</text><circle cx="381.25" cy="850" r="6" fill="none" stroke="#76674F" stroke-width="2"/><text x="381.25" y="882" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="11.5" font-weight="500" fill="#564A3A" text-anchor="middle">மதிப்பாய்வு</text></g><path d="M410 290H454L486 145" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="410" cy="290" r="4" fill="#D2891C"/><circle cx="500" cy="145" r="12" fill="#D2891C"/><text x="500" y="150" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">1</text><text x="522" y="150" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Level ladder, easiest first</text><text x="522" y="170" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">L1 modern → L5 Tamil-Brahmi (contract order).</text><text x="522" y="190" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Each card: era glyph tile, Tamil name, English.</text><path d="M98 560H454L486 265" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="98" cy="560" r="4" fill="#D2891C"/><circle cx="500" cy="265" r="12" fill="#D2891C"/><text x="500" y="270" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">2</text><text x="522" y="270" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Glyph tile</text><text x="522" y="290" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Unicode eras use Noto fonts; L4 draws the</text><text x="522" y="310" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Vatteluttu SVG from design/glyphs/vatteluttu.json.</text><path d="M370 400H454L486 385" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="370" cy="400" r="4" fill="#D2891C"/><circle cx="500" cy="385" r="12" fill="#D2891C"/><text x="500" y="390" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">3</text><text x="522" y="390" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">State on the card, not by colour alone</text><text x="522" y="410" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Done = neem chip with ✓ and text;</text><text x="522" y="430" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">current = laterite border + &#x27;continue&#x27; chip.</text><path d="M240 754H454L486 505" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="240" cy="754" r="4" fill="#D2891C"/><circle cx="500" cy="505" r="12" fill="#D2891C"/><text x="500" y="510" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">4</text><text x="522" y="510" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">One primary action per screen</text><text x="522" y="530" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Full-width pill, 48 px tall (tap ≥ 44 px).</text><path d="M88.75 854H454L486 605" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="88.75" cy="854" r="4" fill="#D2891C"/><circle cx="500" cy="605" r="12" fill="#D2891C"/><text x="500" y="610" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">5</text><text x="522" y="610" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Bottom tabs on mobile, top nav ≥ 1000 px</text><text x="522" y="630" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Labels Tamil-first; English via the</text><text x="522" y="650" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">language toggle in the top bar.</text></svg>
