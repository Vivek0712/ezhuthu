nt-weight="400" fill="#564A3A" text-anchor="start">median_seconds_per_letter in Fraunces numerals.</text><path d="M370 240H454L486 485" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="370" cy="240" r="4" fill="#D2891C"/><circle cx="500" cy="485" r="12" fill="#D2891C"/><text x="500" y="490" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">4</text><text x="522" y="490" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Values here are SAMPLE DATA</text><text x="522" y="510" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Real numbers only from /api/progress and</text><text x="522" y="530" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">eval/reports/. Never hard-code a claim.</text></svg>
