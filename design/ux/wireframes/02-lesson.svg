<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" width="1000" height="980" role="img" aria-label="Lesson · பாடம்"><style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&amp;family=Instrument+Sans:wght@400..700&amp;family=Noto+Sans+Tamil:wght@400..700&amp;family=Noto+Serif+Tamil:wght@400..700&amp;family=Noto+Sans+Brahmi&amp;family=Noto+Sans+Grantha&amp;display=block');</style><rect width="1000" height="980" fill="#EFE8DA"/><text x="40" y="34" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="18" font-weight="700" fill="#1D1611" text-anchor="start">Lesson · பாடம்</text><text x="960" y="34" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12" font-weight="500" fill="#76674F" text-anchor="end">Ezhuthu · wireframe · mobile 390 × 844</text><rect x="30" y="50" width="410" height="864" rx="54" fill="#2A221B"/><clipPath id="scr"><rect x="40" y="60" width="390" height="844" rx="44"/></clipPath><g clip-path="url(#scr)"><rect x="40" y="60" width="390" height="844" rx="0" fill="#F4EEE2"/><text x="70" y="90" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="600" fill="#1D1611" text-anchor="start">9:41</text><rect x="40" y="108" width="390" height="56" rx="0" fill="#F4EEE2"/><path d="M40 164H430" stroke="#DACDB4"/><text x="60" y="144" font-family="'Noto Serif Tamil', serif" font-size="22" font-weight="700" fill="#1D1611" text-anchor="start">எழுத்து</text><path d="M66 140l5 -9l5 9z" fill="#D2891C" opacity="0"/><rect x="302" y="123" width="70" height="26" rx="13" fill="#EAE1CE"/><text x="337.0" y="141" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="600" fill="#1D1611" text-anchor="middle">English</text><rect x="382" y="120" width="32" height="32" rx="16" fill="#EAE1CE"/><path d="M390 130h16M390 136h16M390 142h16" stroke="#1D1611" stroke-width="2" stroke-linecap="round"/><text x="60" y="200" font-family="'Noto Serif Tamil', serif" font-size="24" font-weight="700" fill="#1D1611" text-anchor="start">பாடம்</text><text x="60" y="224" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="500" fill="#564A3A" text-anchor="start">Lesson · reading practice</text><rect x="56" y="246" width="358" height="64" rx="14" fill="#FBF8F1" stroke="#DACDB4"/><text x="70" y="272" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="13.5" font-weight="600" fill="#1D1611" text-anchor="start">பராந்தக சோழன் I · c. 10th c. CE</text><text x="70" y="294" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12" font-weight="500" fill="#9B3D22" text-anchor="start">Source: DHARMA edition ↗  ·  CC BY-SA 4.0</text><text x="56" y="340" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="600" fill="#564A3A" text-anchor="start">3 / 10</text><rect x="108" y="332" width="306" height="8" rx="4" fill="#EAE1CE"/><rect x="108" y="332" width="91.8" height="8" rx="4" fill="#9B3D22"/><rect x="56" y="358" width="358" height="190" rx="18" fill="#FFFDF8" stroke="#DACDB4"/><rect x="70" y="372" width="330" height="124" rx="12" fill="#F5EACB"/><rect x="80" y="382" width="120" height="26" rx="13" fill="#FBF8F1"/><text x="140.0" y="400" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="600" fill="#9B3D22" text-anchor="middle">L4 · வட்டெழுத்து</text><g transform="translate(185.0 384) scale(1.0)"><path d="M50 13V87M17 47C25 38 39 39 50 50C61 61 75 62 83 53" fill="none" stroke="#1D1611" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="74" y="528" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="15" font-weight="700" fill="#1D1611" text-anchor="start">இந்த எழுத்து என்ன? · Which letter is this?</text><rect x="56.0" y="560" width="173.0" height="54" rx="14" fill="#DEEBD7" stroke="#2C6534"/><text x="142.5" y="598" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="28" font-weight="600" fill="#2C6534" text-anchor="middle">க</text><rect x="241.0" y="560" width="173.0" height="54" rx="14" fill="#FFFDF8" stroke="#DACDB4"/><text x="327.5" y="598" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="28" font-weight="600" fill="#1D1611" text-anchor="middle">த</text><rect x="56.0" y="622" width="173.0" height="54" rx="14" fill="#FFFDF8" stroke="#DACDB4"/><text x="142.5" y="660" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="28" font-weight="600" fill="#1D1611" text-anchor="middle">ப</text><rect x="241.0" y="622" width="173.0" height="54" rx="14" fill="#FFFDF8" stroke="#DACDB4"/><text x="327.5" y="660" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="28" font-weight="600" fill="#1D1611" text-anchor="middle">ம</text><rect x="56" y="686" width="358" height="86" rx="14" fill="#DEEBD7" stroke="#2C6534"/><text x="72" y="714" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="16" font-weight="700" fill="#2C6534" text-anchor="start">✓ சரியாகப் படித்தீர்கள்!</text><text x="72" y="738" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="13.5" font-weight="500" fill="#1D1611" text-anchor="start">குறுக்குக் கோடு வளைந்து க ஆனது.</text><text x="72" y="758" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="12.5" font-weight="500" fill="#564A3A" text-anchor="start">The cross-bar became a wave: that is ka.</text><rect x="56" y="780" width="221.96" height="44" rx="22.0" fill="#9B3D22"/><text x="166.98000000000002" y="808.0" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="16" font-weight="600" fill="#FBF8F1" text-anchor="middle">அடுத்தது · Next</text><rect x="287.96000000000004" y="780" width="126.03999999999999" height="44" rx="22.0" fill="none" stroke="#76674F"/><text x="350.98" y="808.0" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="middle">குறிப்பு</text><rect x="40" y="826" width="390" height="78" rx="0" fill="#FBF8F1"/><path d="M40 826H430" stroke="#DACDB4"/><rect x="58.75" y="836" width="60" height="28" rx="14" fill="#F7E0D5"/><circle cx="88.75" cy="850" r="6" fill="#9B3D22" stroke="#9B3D22" stroke-width="2"/><text x="88.75" y="882" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="11.5" font-weight="600" fill="#9B3D22" text-anchor="middle">கற்க</text><circle cx="186.25" cy="850" r="6" fill="none" stroke="#76674F" stroke-width="2"/><text x="186.25" y="882" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="11.5" font-weight="500" fill="#564A3A" text-anchor="middle">மீட்டமை</text><circle cx="283.75" cy="850" r="6" fill="none" stroke="#76674F" stroke-width="2"/><text x="283.75" y="882" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="11.5" font-weight="500" fill="#564A3A" text-anchor="middle">முன்னேற்றம்</text><circle cx="381.25" cy="850" r="6" fill="none" stroke="#76674F" stroke-width="2"/><text x="381.25" y="882" font-family="'Noto Sans Tamil', 'Instrument Sans', sans-serif" font-size="11.5" font-weight="500" fill="#564A3A" text-anchor="middle">மதிப்பாய்வு</text></g><path d="M400 270H454L486 145" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="400" cy="270" r="4" fill="#D2891C"/><circle cx="500" cy="145" r="12" fill="#D2891C"/><text x="500" y="150" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">1</text><text x="522" y="150" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Inscription context first</text><text x="522" y="170" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Ruler, date, and a link to the DHARMA edition</text><text x="522" y="190" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">with its licence, on every lesson.</text><path d="M390 400H454L486 255" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="390" cy="400" r="4" fill="#D2891C"/><circle cx="500" cy="255" r="12" fill="#D2891C"/><text x="500" y="260" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">2</text><text x="522" y="260" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Glyph card (see glyph-card spec)</text><text x="522" y="280" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Palm-leaf well, era chip, glyph ≥ 96 px.</text><text x="522" y="300" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Drawn glyphs say so on long-press / tooltip.</text><path d="M390 580H454L486 375" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="390" cy="580" r="4" fill="#D2891C"/><circle cx="500" cy="375" r="12" fill="#D2891C"/><text x="500" y="380" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">3</text><text x="522" y="380" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Answer grid, 2 × 2</text><text x="522" y="400" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Tamil letters at 28 px; 62 px targets.</text><text x="522" y="420" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Selected-correct uses colour + ✓ + text.</text><path d="M390 710H454L486 495" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="390" cy="710" r="4" fill="#D2891C"/><circle cx="500" cy="495" r="12" fill="#D2891C"/><text x="500" y="500" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">4</text><text x="522" y="500" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Feedback in Tamil first</text><text x="522" y="520" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">feedback_ta, then feedback_en in muted text.</text><text x="522" y="540" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">next_action drives the buttons (advance/repeat/hint).</text><path d="M370 795H454L486 615" fill="none" stroke="#D2891C" stroke-width="1.2"/><circle cx="370" cy="795" r="4" fill="#D2891C"/><circle cx="500" cy="615" r="12" fill="#D2891C"/><text x="500" y="620" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="#1D1611" text-anchor="middle">5</text><text x="522" y="620" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="15" font-weight="600" fill="#1D1611" text-anchor="start">Hint is always secondary</text><text x="522" y="640" font-family="'Instrument Sans', 'Noto Sans Tamil', sans-serif" font-size="14" font-weight="400" fill="#564A3A" text-anchor="start">Ghost button; never hides the answer grid.</text></svg>
