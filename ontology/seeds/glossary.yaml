# Curated seed list: formulas, institutions and technical vocabulary of Tamil inscriptions.
# Variants are ISO-15919 stems as written in DHARMA editions; matching is anchored at a word or
# compound-member boundary and allows case endings after the stem (see normalize.py).
# The build drops any entry that is not attested in the corpus and reports it in coverage.json.
# label_en glosses are short curated glosses as commonly given in Tamil epigraphy (not quoted from DHARMA);
# the tutor should prefer the DHARMA translation of the attesting inscription when it shows one.

formulas:
  - {slug: svasti-sri, label_iso: svasti śrī, label_en: "Prosperity! Fortune!", variants: [svasti śrī, svasti śri, svasticrī],
     note: "auspicious opening of most inscriptions"}
  - {slug: regnal-year, label_iso: yāṇṭu … āvatu, label_en: "in the … year (of the reign)", variants: [yāṇṭu],
     note: "regnal-year formula: <title/name>-kku yāṇṭu <number>-āvatu; a gap just before 'yāṇṭu' usually hides a royal name"}
  - {slug: ko-vicaiya, label_iso: kō-vicaiya-…-varmaṟku, label_en: "to the victorious king …", dynasty: pallava,
     variants: [kō vicaiya, kōviśaiya, kōvijaya], note: "Pallava regnal-year formula prefix (kō-vicaiya-nanti-vikkirama-parumaṟku yāṇṭu …)"}
  - {slug: matirai-konta, label_iso: matirai koṇṭa kō-p-parakēcari-varmaṉ, label_en: "Parakesarivarman who took Madurai",
     dynasty: chola, ruler: parantaka-i, variants: [matirai koṇṭa, maturai koṇṭa]}
  - {slug: kantalur-calai, label_iso: kāntaḷūr-c-cālai kalam aṟutta, label_en: "who destroyed the ships at Kāntaḷūr Cālai",
     dynasty: chola, ruler: rajaraja-i, variants: [kāntaḷūrc cālai kalam aṟutta, cālai kalam aṟutta, kāntaḷūr cālai]}
  - {slug: tirumakal-pola, label_iso: tirumakaḷ pōla, label_en: "as the goddess of fortune…", dynasty: chola, ruler: rajaraja-i,
     variants: [tirumakaḷ pōla, tirumakaḷ pōlap peru nilac celvi], note: "meykkīrtti (royal praise) incipit of Rājarāja I"}
  - {slug: tirumanni-valara, label_iso: tiru maṉṉi vaḷara, label_en: "while fortune grows and abides", dynasty: chola, ruler: rajendra-i,
     variants: [tiru maṉṉi vaḷara, tirumaṉṉi vaḷara], note: "meykkīrtti incipit of Rājendra I"}
  - {slug: tinkal-er-taru, label_iso: tiṅkaḷ ēr taru, dynasty: chola, ruler: rajadhiraja-i, variants: [tiṅkaḷ ēr taru, tiṅkaḷēr taru],
     note: "meykkīrtti incipit of Rājādhirāja I"}
  - {slug: pu-maruviya, label_iso: pū maruviya tirumātum, dynasty: chola, ruler: rajaraja-ii, variants: [pū maruviya tirumātum, pūmaruviya],
     note: "meykkīrtti incipit; DHARMA attests it under Rājarāja II"}
  - {slug: pukal-matu-vilanka, label_iso: pukaḻ mātu viḷaṅka, dynasty: chola, ruler: kulottunga-i, variants: [pukaḻ mātu viḷaṅka, pukaḻmātu viḷaṅka],
     note: "meykkīrtti incipit; DHARMA attests it under Kulottuṅga Cōḻa"}
  - {slug: kacciyum-tancaiyum, label_iso: kacciyun tañcaiyuṅ koṇṭa, label_en: "who took Kacci and Tañcai", dynasty: rashtrakuta,
     ruler: kannaradeva, variants: [kacciyun tañcaiyuṅ koṇṭa, kacciyum tañcaiyum koṇṭa, kacciyun tañcai]}
  - {slug: tiruvaykkelvi, label_iso: tiruvāykkēḻvi, label_en: "royal oral order", variants: [tiruvāykkēḻvi, tiruvāykkeḻvi, tiruvāy-k-kēḻvi]}
  - {slug: candradityavat, label_iso: cantirātittavaraiyum, label_en: "as long as the moon and sun endure",
     variants: [cantirātittavar, cantirātittar, candrādityavat, cantirātittaval], note: "duration clause of endowments"}
  - {slug: imprecation, label_iso: … ceyvāṉ pāvam koḷvāṉ, label_en: "whoever harms this incurs the sin …",
     variants: [kaṅkaiyiṭaik kumariyiṭai, ceyta pāvam], note: "imprecatory (curse) clause protecting the grant"}

