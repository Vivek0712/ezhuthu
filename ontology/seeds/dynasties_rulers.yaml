  - slug: chola
    label_iso: Cōḻa
    variants: [cōḻa, cōḷa, cōḻar, cōḻaṉ]
    era: c. 9th–13th c. CE (imperial Cōḻas)
    wikidata: Q151148
    tamil_stage: chola-tamil
  - slug: pandya
    label_iso: Pāṇḍya
    variants: [pāṇḍya, pāṇṭiya, pāṇṭiyaṉ, pāṇṭi]
    era: c. 6th–14th c. CE (first and second empires)
    wikidata: Q844910
    tamil_stage: null
  - slug: rashtrakuta
    label_iso: Rāṣṭrakūṭa
    variants: [rāṣṭrakūṭa, irāṭṭakūṭa]
    era: c. 8th–10th c. CE
    wikidata: Q856691
    tamil_stage: chola-tamil
  - slug: kadava
    label_iso: Kāṭava
    variants: [kāṭava, kāṭavar, kāṭavaṉ]
    era: c. 13th c. CE (Kāṭava chiefs)
    wikidata: Q6345221
    tamil_stage: chola-tamil
  - slug: vijayanagara
    label_iso: Vijayanagara
    variants: [vijayanagara, vijayanakara]
    era: c. 1336–1646 CE
    wikidata_label: Vijayanagara Empire
    tamil_stage: later-tamil

