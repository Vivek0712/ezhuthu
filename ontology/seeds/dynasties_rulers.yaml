# Curated seed list: dynasties, rulers and royal titles.
# Variants are ISO-15919 spellings as they occur in DHARMA editions (Tamil and Sanskrit forms).
# The build keeps only entries whose variants (or DHARMA header titles) are attested in the corpus,
# and fills attested_in from the corpus scan. Wikidata QIDs are resolved by
# `python -m ezhuthu.ontology.wikidata --refresh` from `wikidata_label` and reviewed in
# ontology/wikidata/snapshot.json; an ambiguous name (e.g. "Mahendravarman", I/II/III) gets no QID.
# Regnal dates are conventional and approximate (era strings start with "c.").
# Sources: DHARMA header titles and editions (CC BY 4.0); conventional chronology as summarised in
# K. A. Nilakanta Sastri, The Cōḻas (1955) for Chola rulers; Wikidata for identifiers.

dynasties:
  - slug: pallava
    label_iso: Pallava
    variants: [pallava, pallavar, pallavaṉ, pallava-kula]
    era: c. 4th–9th c. CE
    wikidata: Q466803
