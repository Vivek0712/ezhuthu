.fh { padding: 56px 72px 0; }

.fh h1 em { font-style: normal; color: var(--lat-600); }
.dark .fh h1 em { color: var(--lamp-400); }
.fh .dek { font: 400 22px/1.45 var(--sans); color: var(--stone-700); margin-top: 14px; max-width: 1300px; }
.dark .fh .dek { color: #C9BBA3; }

.ff .src { text-align: right; max-width: 1250px; }
.mono { font-family: var(--mono); }
