<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a2-09-practice</title>
<link rel="stylesheet" href="/media/video/scenes/_lib/scene.css">
<script src="/media/video/scenes/_lib/timeline.js"></script>
<script src="/media/video/scenes/_lib/kit.js"></script>
<style>
  #bg { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 35% 40%, #2A221B, #13100D 70%); }
  #world { position: absolute; inset: 0; }
  #head { position: absolute; left: 72px; top: 44px; display: flex; align-items: baseline; gap: 26px; }
  #head .eyebrow { margin-right: 6px; }
  #n { font-size: 112px; line-height: 1; color: var(--lamp300); text-shadow: 0 0 50px rgba(234,164,58,.35); }
  #nl { font: 600 46px/1.1 var(--f-display); font-variation-settings: 'opsz' 72; color: var(--s50); }
  #br { left: 72px; top: 206px; width: 1180px; height: 712px; }
  #br video { position: absolute; left: 0; top: 48px; width: 1180px; height: 664px; object-fit: cover; }
  #ring { position: absolute; width: 360px; height: 120px; border-radius: 22px; border: 4px solid var(--lamp400); pointer-events: none;
          box-shadow: 0 0 30px rgba(234,164,58,.8), inset 0 0 20px rgba(234,164,58,.3); }
  #phone { position: absolute; left: 1392px; top: 120px; width: 400px; height: 846px; border-radius: 58px; background: #2D261F; padding: 14px;
           box-shadow: 0 40px 120px rgba(0,0,0,.65), 0 0 0 2px #40362B, 0 0 90px rgba(234,164,58,.14); }
  #phone .scr { position: relative; width: 372px; height: 818px; border-radius: 46px; overflow: hidden; background: #13100D; }
  #phone video { position: absolute; left: 0; top: 0; width: 372px; height: 805px; object-fit: cover; object-position: top; }
  #phone .notch { position: absolute; left: 50%; top: 10px; width: 110px; height: 30px; margin-left: -55px; border-radius: 16px; background: #0B0907; z-index: 2; }
  #bar { position: absolute; left: 72px; top: 958px; width: 1180px; }
  #bar .track { display: flex; height: 22px; border-radius: 11px; overflow: hidden; background: #2D261F; }
  #bar .seg { height: 100%; }
  #bar .lab { display: flex; margin-top: 14px; font: 500 25px/1 var(--f-ui); color: var(--s200); }
  #bar .lab div { white-space: nowrap; }
  #bar .lab b { font-family: var(--f-display); font-weight: 600; color: var(--s50); margin-left: 8px; font-variant-numeric: tabular-nums; }
  #lv { position: absolute; left: 1392px; top: 990px; width: 400px; text-align: center; font: 600 28px/1.2 var(--f-ui); color: var(--s100); }
  #lv span { color: var(--lamp300); }
</style></head>
<body><div id="stage">
  <div id="bg"><div class="dotgrid" style="opacity:.5"></div></div>
  <div id="world">
    <div id="head"><span class="eyebrow">Practice</span><span class="num" id="n">0</span><span id="nl">drills from real stones</span></div>
    <div class="browser" id="br"><div class="bar"><i></i><i></i><i></i><div class="url">ezhuthu.sparrowdecider.com/practice</div></div></div>
    <div id="ring"></div>
    <div id="phone"><div class="scr"><div class="notch"></div></div></div>
    <div id="bar">
      <div class="track"><div class="seg" style="background:#F5C468"></div><div class="seg" style="background:#D9764F"></div><div class="seg" style="background:#AEB8EC"></div><div class="seg" style="background:#93D09C"></div></div>
      <div class="lab"><div>letters<b>205</b></div><div>words<b>540</b></div><div>gaps<b>394</b></div><div>formulas<b>330</b></div></div>
    </div>
    <div id="lv">five levels, <span>Tamil first</span></div>
  </div>
  <div class="src">Inscription texts: DHARMA, CC BY-SA 4.0 · live site capture</div>
</div>
<script>
const { p, E, $, $$, css, count, clamp } = EZ;
const vd = KIT.clip($('#br'), 'practice');
const vm = KIT.clip($('#phone .scr'), 'practice-mobile');
const g = KIT.grain(null, 0.05);
const PARTS = [205, 540, 394, 330], TOT = 1469;
const segs = $$('#bar .seg'), labs = $$('#bar .lab div');
PARTS.forEach((n, i) => { labs[i].style.width = (n / TOT * 1180) + 'px'; });
window.SCENE = {
  duration: 10.0,
  async render(t) {
    g(t);
    await Promise.all([KIT.seek(vd, 0.6 + t * 0.95), KIT.seek(vm, Math.max(0, t - 0.4))]);
    const a = p(t, -0.12, 0.35); // partly in on the cut frame: no empty first frame
    css($('#br'), { opacity: a, transform: `translateY(${(1 - a) * 30}px)` });
    const b = p(t, -0.05, 0.4);
    css($('#phone'), { opacity: b, transform: `translateY(${(1 - b) * 40}px)` });
    css($('#head'), { opacity: p(t, -0.05, 0.3) });
    $('#n').textContent = '1,469'; // final value from the first frame (a hard cut lands here)
    // stacked bar at 4.0 s
    let acc = 0;
    PARTS.forEach((n, i) => { const k = p(t, 4.0 + i * 0.18, 0.5, E.standard); segs[i].style.width = (n / TOT * 100 * k) + '%'; labs[i].style.opacity = p(t, 4.2 + i * 0.18, 0.4); });
    css($('#lv'), { opacity: p(t, 5.0, 0.5) });
    // lamp pulse ring on the correct answer (it turns green at source ~7.6 s)
    const r = p(t, 7.35, 0.35, E.outBack), pulse = 0.6 + 0.4 * Math.cos((t - 7.7) * Math.PI * 2 / 0.8);
    css($('#ring'), { left: (72 + 0.6146 * 160 - 10) + 'px', top: (206 + 48 + 0.6146 * 784 - 12) + 'px', width: (0.6146 * 560 + 20) + 'px', height: (0.6146 * 144 + 24) + 'px',
      opacity: t < 7.35 ? 0 : clamp(r) * (0.55 + 0.45 * pulse), transform: `scale(${1.15 - 0.15 * clamp(r)})` });
    // whip-pan right into a2-10 over the last 0.6 s
    const w = p(t, 9.4, 0.6, E.exit);
    css($('#world'), { transform: `translateX(${-2200 * w}px)`, filter: w > 0 ? `blur(${28 * w}px)` : 'none' });
  },
};
</script></body></html>
