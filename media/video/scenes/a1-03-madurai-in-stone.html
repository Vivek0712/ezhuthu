<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a1-03-madurai-in-stone</title>
<link rel="stylesheet" href="/media/video/scenes/_lib/scene.css">
<script src="/media/video/scenes/_lib/timeline.js"></script>
<script src="/media/video/scenes/_lib/kit.js"></script>
<style>
  #dim { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 70% at 50% 45%, rgba(19,16,13,.45), rgba(19,16,13,.8)); }
  #word { position: absolute; left: 0; right: 0; top: 150px; height: 300px; text-align: center; }
  #word .w { position: absolute; left: 0; right: 0; top: 0; font: 700 190px/1.45 var(--f-ta-display); letter-spacing: .02em; }
  #w-out { color: transparent; -webkit-text-stroke: 3px var(--lamp300); filter: drop-shadow(0 0 14px rgba(234,164,58,.8)); }
  #w-fill { color: var(--lamp300); text-shadow: 0 0 60px rgba(234,164,58,.55), 0 6px 30px rgba(0,0,0,.8); }
  #edge { position: absolute; top: 175px; width: 6px; height: 250px; border-radius: 3px; background: var(--lamp200);
          box-shadow: 0 0 24px 8px rgba(245,196,104,.8), 0 0 80px 20px rgba(234,164,58,.45); }
  #iso { position: absolute; left: 0; right: 0; top: 455px; text-align: center; font: 500 34px/1 var(--f-mono); color: var(--s300); letter-spacing: .3em; }
  #stat { position: absolute; left: 0; right: 0; top: 560px; display: flex; justify-content: center; align-items: baseline; gap: 34px; }
  #n { font-size: 200px; line-height: 1; color: var(--s50); text-shadow: 0 8px 50px rgba(0,0,0,.8); min-width: 240px; text-align: right; }
  #nl { font: 600 54px/1.1 var(--f-display); font-variation-settings: 'opsz' 72; color: var(--s100); text-shadow: 0 4px 30px rgba(0,0,0,.9); }
  #sub { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font: 500 34px/1.35 var(--f-ui); color: var(--s300); text-shadow: 0 2px 20px rgba(0,0,0,.9); }
  #sub i { font-family: var(--f-mono); font-style: normal; color: var(--lamp300); font-size: 30px; }
</style></head>
<body><div id="stage">
  <div id="P"></div>
  <div id="dim"></div>
  <div id="word"><div class="w" id="w-out">மதுரை</div><div class="w" id="w-fill">மதுரை</div></div>
  <div id="edge"></div>
  <div id="iso">Madurai</div>
  <div id="stat"><div class="num" id="n">0</div><div id="nl">editions name Madurai</div></div>
  <div id="sub">carved as <span lang="ta">மதிரை</span> (<i>matirai</i>) · 23 in a Chola king's title, “who took Madurai”</div>
  <div class="vignette"></div>
  <div class="src">Texts: DHARMA, CC BY-SA 4.0</div>
  <div class="src src-r">Photo: Thanjavur, KARTY JazZ, CC BY-SA 4.0</div>
</div>
<script>
const { p, E, $, css, clamp, count } = EZ;
const P = KIT.photo($('#P'), 'p11');
const g = KIT.grain();
let W0 = 0, W1 = 1920;
window.SCENE = {
  duration: 6.0,
  prepare() { // measure the word so the chisel edge tracks the glyphs
    const r = document.createRange(); r.selectNodeContents($('#w-fill')); const b = r.getBoundingClientRect(); W0 = b.left; W1 = b.right;
  },
  render(t) {
    g(t);
    KIT.kb(P, [0.00, 0.25, 0.62, 0.40], [0.38, 0.25, 0.62, 0.40], t / 6);
    // chisel reveal 0.6 -> 1.9 s
    const k = p(t, 0.6, 1.3, E.chisel);
    const x = W0 - 10 + (W1 - W0 + 20) * k;
    const clip = `inset(0 ${1920 - x}px 0 0)`;
    css($('#w-out'), { clipPath: k >= 1 ? 'none' : clip, opacity: 1 - p(t, 1.9, 0.6) });
    css($('#w-fill'), { clipPath: k >= 1 ? 'none' : `inset(0 ${1920 - x + 60}px 0 0)`, opacity: p(t, 0.9, 1.2, E.linear) });
    css($('#edge'), { left: x + 'px', opacity: k > 0 && k < 1 ? 1 : 0 });
    const i = p(t, 1.7, 0.5); css($('#iso'), { opacity: i, letterSpacing: (0.6 - 0.3 * i) + 'em' });
    // count-up 2.2 s
    const s = p(t, 2.1, 0.4); css($('#stat'), { opacity: s, transform: `translateY(${(1 - s) * 20}px)` });
    $('#n').textContent = count(t, 2.05, 0.4, 25, 0, 0, E.outExpo);
    const u = p(t, 4.0, 0.6); css($('#sub'), { opacity: u, transform: `translateY(${(1 - u) * 14}px)` });
  },
};
</script></body></html>
