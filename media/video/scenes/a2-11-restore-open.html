<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a2-11-restore-open</title>
<link rel="stylesheet" href="/media/video/scenes/_lib/scene.css">
<script src="/media/video/scenes/_lib/timeline.js"></script>
<script src="/media/video/scenes/_lib/kit.js"></script>
<style>
  /* Live-site stills at 3x DPR (capture.mjs restore-open-stills); boxes from footage/stills/restore-open.json */
  #V { position: absolute; inset: 0; overflow: hidden; background: #16120E; }
  #V img { position: absolute; left: 0; top: 0; width: 1280px; transform-origin: 0 0; }
  #dim { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  #ring { position: absolute; z-index: 20; border: 4px solid var(--neelam300); border-radius: 14px; pointer-events: none; }
  #chip { position: absolute; right: 64px; top: 44px; z-index: 30; display: flex; gap: 14px; align-items: center; padding: 14px 26px; border-radius: 999px;
          background: rgba(19,16,13,.96); border: 1.5px solid rgba(174,184,236,.6); font: 600 30px/1 var(--f-ui); color: var(--s50); }
  #chip span { color: var(--neelam300); }
  #band { position: absolute; left: 0; right: 0; bottom: 0; height: 360px; z-index: 28; pointer-events: none;
          background: linear-gradient(180deg, rgba(19,16,13,0), rgba(19,16,13,.97) 34%, #13100D); }
  #card { position: absolute; left: 64px; bottom: 64px; z-index: 30; padding: 30px 40px; border-radius: 26px; background: #13100D;
          border: 1.5px solid rgba(174,184,236,.5); box-shadow: 0 30px 90px rgba(0,0,0,.65), 0 0 60px rgba(174,184,236,.15); max-width: 1500px; }
  #card .a { font: italic 600 64px/1.1 var(--f-display); font-variation-settings: 'opsz' 144; color: var(--s50); }
  #card .b { margin-top: 14px; font: 500 32px/1.3 var(--f-ui); color: var(--neelam300); }
  #card .c { margin-top: 8px; font: 500 24px/1.3 var(--f-ui); color: var(--s300); }
</style></head>
<body><div id="stage">
  <div id="V"><img id="I1" src="/__footage/stills/restore-open-input.jpg" alt=""><img id="I2" src="/__footage/stills/restore-open-result.jpg" alt=""></div>
  <div id="dim"></div>
  <div id="ring"></div>
  <div id="chip">Restore <span>· leaves it open</span></div>
  <div id="band"></div>
  <div id="card"><div class="a">Doubt becomes the lesson</div><div class="b" id="cb">Unsolved gaps: options proposed, sent to an expert</div><div class="c">Mamallapuram, Pallava; the editors left this blank too · DHARMA, CC BY-SA 4.0</div></div>
</div>
<script>
const { p, E, $, css, clamp, lerp } = EZ;
const g = KIT.grain(null, 0.04);
let GAP, UNSURE;
function cam(img, x0, y0, s, sx, sy) { img.style.transform = `translate(${(sx - x0 * s).toFixed(2)}px, ${(sy - y0 * s).toFixed(2)}px) scale(${s.toFixed(5)})`; return (x, y) => [sx + (x - x0) * s, sy + (y - y0) * s]; }
window.SCENE = {
  duration: 9.5,
  async prepare() {
    const J = await (await fetch('/__footage/stills/restore-open.json')).json();
    GAP = J.result.find((r) => r.text === '??' && r.y > 1400 && r.h > 25);
    UNSURE = J.result.find((r) => /abstain-sub/.test(r.cls));
  },
  render(t) {
    g(t);
    const I1 = $('#I1'), I2 = $('#I2');
    let map, s;
    // the input line with its [?2] gap (0-1.0 s), hard cut to the result
    if (t < 1.0) { I1.style.display = ''; I2.style.display = 'none'; s = lerp(1.4, 1.43, t); map = cam(I1, 100, 770, s, 120, 140); }
    else {
      I1.style.display = 'none'; I2.style.display = '';
      if (t < 6.5) {
        // whole sentence + whole Tamil lines; push-in keeps the left edge of the lines in frame (no mid-word crop)
        const z = E.inOut(clamp((t - 3.7) / 1.3));
        s = lerp(1.74, 2.2, z);
        map = cam(I2, lerp(100, 112, z), lerp(1232, 1362, z), s, 70, lerp(150, 120, z));
      } else {
        // hard cut: the app's own words, "Experts are unsure"
        s = lerp(1.66, 1.72, clamp((t - 6.5) / 3));
        map = cam(I2, 118, 2024, s, 90, 190);
      }
    }
    const open = t >= 1.0 && t < 6.5;
    if (open) {
      const [x, y] = map(GAP.x - 7, GAP.y - 6), w = (GAP.w + 14) * s, h = (GAP.h + 12) * s;
      const hk = Math.min(p(t, 1.9, 0.5), 1 - p(t, 6.2, 0.3));
      const pulse = 0.6 + 0.4 * Math.cos((t - 2.4) * Math.PI * 2 / 1.1);
      css($('#ring'), { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', opacity: hk,
        boxShadow: `0 0 ${40 * pulse}px rgba(174,184,236,${0.9 * pulse}), inset 0 0 20px rgba(174,184,236,.35)` });
      css($('#dim'), { opacity: hk * 0.9, background: `radial-gradient(circle 300px at ${x + w / 2}px ${y + h / 2}px, rgba(19,16,13,0), rgba(19,16,13,.5))` });
    } else { css($('#ring'), { opacity: 0 }); css($('#dim'), { opacity: 0 }); }
    css($('#chip'), { opacity: p(t, 0.15, 0.4) });
    const c = p(t, 4.6, 0.5, E.standard);
    css($('#card'), { opacity: c, transform: `translateY(${(1 - c) * 24}px)` }); css($('#band'), { opacity: p(t, 4.4, 0.4) });
    css($('#cb'), { opacity: p(t, 5.3, 0.5) });
  },
};
</script></body></html>
