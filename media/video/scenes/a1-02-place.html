<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a1-02-place</title>
<link rel="stylesheet" href="/media/video/scenes/_lib/scene.css">
<script src="/media/video/scenes/_lib/timeline.js"></script>
<script src="/media/video/scenes/_lib/kit.js"></script>
<style>
  #V { position: absolute; inset: 0; overflow: hidden; }
  #V video { filter: sepia(.14) saturate(1.04) contrast(1.06) brightness(.95); }
  #Vw { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(234,164,58,.16), rgba(181,80,47,.14)); mix-blend-mode: soft-light; }
  #C .ph img { filter: sepia(.18) saturate(1.1) contrast(1.1) brightness(1.08); }
  #C .ph-warm::after { opacity: .2; }
  #dusk { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(181,80,47,.55), rgba(234,164,58,.35) 45%, rgba(0,0,0,0) 70%); mix-blend-mode: multiply; }
  #lt { bottom: 112px; }
  #lt .l1 { font-size: 72px; }
  #lt .l1 em { font-style: normal; color: var(--lamp300); }
</style></head>
<body><div id="stage">
  <div id="A"></div>
  <div id="V"><div id="Vw"></div></div>
  <div id="C"></div>
  <div id="dusk"></div>
  <div class="vignette" id="vig" style="opacity:.75"></div>
  <div class="scrim-b" id="scrim"></div>
  <div class="tag" id="t1">Madurai</div>
  <div class="tag" id="t2">Thanjavur</div>
  <div class="lt" id="lt"><div class="l1">Brihadisvara temple</div><div class="l2">Thanjavur · completed <b style="color:var(--lamp300)">1010 CE</b></div></div>
  <div class="src src-r" id="c1">Photo: Prakashkumar, CC BY-SA 4.0</div>
  <div class="src src-r" id="c2">Video: Rainer Halama, CC BY-SA 4.0</div>
  <div class="src src-r" id="c3">Photo: Cafeskool, CC BY-SA 4.0</div>
</div>
<script>
const { p, E, $, css, clamp } = EZ;
const A = KIT.photo($('#A'), 'p04');
const C = KIT.photo($('#C'), 'p14');
const v = KIT.clip($('#V'), 'v05', 'vclip');
$('#V').insertBefore(v, $('#Vw'));
const g = KIT.grain();
window.SCENE = {
  duration: 9.0,
  async render(t) {
    g(t);
    // 0 - 3.6 s: aerial Madurai push-in toward the right-hand gopuram
    KIT.kb(A, [0.10, 0.12, 0.80, 0.735], [0.38, 0.05, 0.55, 0.505], E.inOut(t / 4.1));
    // 3.6 - 4.1 s match-dissolve to Thanjavur footage (source 3.0 -> 6.6 s; clip starts at source 2.4 s)
    const dv = p(t, 3.6, 0.5, E.linear);
    css($('#V'), { opacity: dv, display: t < 3.55 || t >= 7.2 ? 'none' : '' });
    css($('#A'), { display: t >= 4.15 ? 'none' : '' });
    if (t >= 3.5 && t < 7.2) {
      const s = 1 + 0.05 * clamp((t - 3.6) / 3.6);
      v.style.transform = `translate(${960 * (1 - s)}px, ${540 * (1 - s)}px) scale(${s})`;
      await KIT.seek(v, 0.6 + (t - 3.6));
    }
    // 7.2 s cut to the vimana at dusk, push-in
    const cIn = t >= 7.2;
    css($('#C'), { display: cIn ? '' : 'none' }); css($('#dusk'), { display: cIn ? '' : 'none' });
    KIT.kb(C, [0.15, 0.05, 0.70, 0.68], [0.27, 0.03, 0.46, 0.45], E.standard(clamp((t - 7.2) / 1.8)));
    // tags + credits
    css($('#t1'), { opacity: Math.min(p(t, 0.3, 0.5), 1 - p(t, 3.4, 0.3)) });
    css($('#t2'), { opacity: t < 7.2 ? Math.min(p(t, 4.0, 0.5), 1 - p(t, 6.9, 0.3)) : 0 });
    const l = p(t, 7.45, 0.6, E.standard);
    css($('#lt'), { opacity: l, transform: `translateY(${(1 - l) * 24}px)` });
    css($('#scrim'), { opacity: cIn ? 0.85 : 0.5 });
    css($('#vig'), { opacity: cIn ? 0.35 : 0.75 });
    $('#c1').style.display = t < 3.85 ? '' : 'none';
    $('#c2').style.display = t >= 3.85 && t < 7.2 ? '' : 'none';
    $('#c3').style.display = cIn ? '' : 'none';
  },
};
</script></body></html>
