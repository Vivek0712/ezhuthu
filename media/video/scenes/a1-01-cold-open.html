<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a1-01-cold-open</title>
<link rel="stylesheet" href="/media/video/scenes/_lib/scene.css">
<script src="/media/video/scenes/_lib/timeline.js"></script>
<script src="/media/video/scenes/_lib/kit.js"></script>
<style>
  #rake { position: absolute; inset: 0; z-index: 20; mix-blend-mode: soft-light; pointer-events: none; }
  #erode { position: absolute; inset: 0; z-index: 10; }
  #erode .ph img { filter: blur(16px) sepia(.2) brightness(1.08) contrast(.85); }
  #scrim { position: absolute; inset: 0; z-index: 55; background: linear-gradient(90deg, rgba(19,16,13,.84), rgba(19,16,13,.55) 45%, rgba(19,16,13,0) 78%); }
  #stk { position: absolute; left: 96px; top: 50%; z-index: 60; transform: translateY(-54%); max-width: 1300px; }
  #stk .l { font: 600 92px/1.06 var(--f-display); font-variation-settings: 'opsz' 144, 'SOFT' 0; color: var(--s50); text-shadow: 0 6px 50px rgba(0,0,0,.9), 0 2px 6px rgba(0,0,0,.8); }
  #stk .l b { color: var(--lamp300); font-weight: 700; }
  #stk .s { margin-top: 24px; font: 500 28px/1.3 var(--f-ui); color: var(--s200); text-shadow: 0 2px 16px rgba(0,0,0,.95); }
</style></head>
<body><div id="stage">
  <div id="B"></div>
  <div id="erode"></div>
  <div id="rake"></div>
  <div class="vignette"></div>
  <div id="scrim"></div>
  <div id="stk"><div class="l" id="l1">About <b>23</b> epigraphists.</div><div class="l" id="l2">Nearly <b>one lakh</b> inscriptions.</div>
    <div class="s" id="ls">India, 2021 · The Federal, 3 Aug 2021</div></div>
  <div class="tag" id="tag">Tamil inscription on a temple wall, Tamil Nadu</div>
  <div class="src src-r" id="cr2">Photo: Neechalkaran, CC BY-SA 4.0</div>
  <div class="blackout" id="bk"></div>
</div>
<script>
const { p, E, $, css, clamp } = EZ;
// Cold open, v3: the inscribed temple wall (p17) from frame 0, the stakes on screen in the first second (P1 / E7),
// raking lamp light, then three carved letters wear away ("The letters are fading"). No count-up: final numbers only.
const B = KIT.photo($('#B'), 'p17');
const Bx = KIT.photo($('#erode'), 'p17', { grade: false });
const g = KIT.grain();
const LET = [[0.468, 0.462], [0.492, 0.462], [0.517, 0.462]];
const SA = [0.16, 0.28, 0.54, 0.30], SB = [0.24, 0.34, 0.40, 0.225];
window.SCENE = {
  duration: 5.0,
  render(t) {
    g(t);
    css($('#bk'), { opacity: 1 - p(t, 0, 0.3, E.linear) });
    const k = E.standard(clamp(t / 5));
    KIT.kb(B, SA, SB, k); KIT.kb(Bx, SA, SB, k);
    const sw = p(t, 0.2, 2.2, E.chisel), x = -30 + sw * 150;
    css($('#rake'), { background: `linear-gradient(100deg, rgba(0,0,0,.55) ${x - 35}%, rgba(234,164,58,.95) ${x}%, rgba(251,223,166,.5) ${x + 7}%, rgba(0,0,0,.25) ${x + 40}%)` });
    const e = p(t, 3.0, 1.0, E.standard);
    const masks = LET.map(([u, v]) => { const [sx, sy] = B.pt(u, v); const r = 0.013 * B.iw * B.s; return `radial-gradient(${r}px ${r * 1.15}px at ${sx}px ${sy}px, #000 55%, transparent 100%)`; });
    css($('#erode'), { opacity: 0.6 * e, webkitMaskImage: masks.join(','), maskImage: masks.join(',') });
    const out = 1 - p(t, 4.4, 0.45, E.exit);
    const a1 = p(t, 0.2, 0.4), a2 = p(t, 0.75, 0.4);
    css($('#l1'), { opacity: Math.min(a1, out), transform: `translateY(${(1 - a1) * 18}px)` });
    css($('#l2'), { opacity: Math.min(a2, out), transform: `translateY(${(1 - a2) * 18}px)` });
    css($('#ls'), { opacity: Math.min(p(t, 1.2, 0.4), out) });
    css($('#scrim'), { opacity: Math.min(p(t, 0.05, 0.3), 0.25 + 0.75 * out) });
    css($('#tag'), { opacity: Math.min(p(t, 1.6, 0.5), out) });
  },
};
</script></body></html>
