<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a2-07-title</title>
<link rel="stylesheet" href="/media/video/scenes/_lib/scene.css">
<script src="/media/video/scenes/_lib/timeline.js"></script>
<script src="/media/video/scenes/_lib/kit.js"></script>
<style>
  #A { position: absolute; inset: 0; }
  #A .ph img { filter: sepia(.2) saturate(.9) brightness(.85) blur(1.5px); }
  #dk { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 60% at 50% 45%, rgba(19,16,13,.55), rgba(19,16,13,.85)); }
  #glow { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--lamp200); }
  #halo { position: absolute; left: 960px; top: 420px; width: 1600px; height: 1000px; margin: -500px 0 0 -800px; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(234,164,58,.30), rgba(234,164,58,.10) 45%, rgba(234,164,58,0)); }
  #mark { position: absolute; left: 797px; top: 140px; width: 326px; height: 224px; }
  #wta { position: absolute; left: 577px; top: 400px; width: 765px; height: 241px; }
  #wen { position: absolute; left: 0; right: 0; top: 668px; text-align: center; font: 500 104px/1 var(--f-display); font-variation-settings: 'opsz' 144, 'SOFT' 0; color: var(--s50); letter-spacing: .01em; }
  #mean { position: absolute; left: 0; right: 0; top: 800px; text-align: center; font: italic 400 34px/1 var(--f-display); color: var(--lamp300); }
  #sub { position: absolute; left: 0; right: 0; top: 880px; text-align: center; font: 500 38px/1 var(--f-ui); color: var(--s200); letter-spacing: .04em; }
</style></head>
<body><div id="stage">
  <div id="A"></div>
  <div id="dk"></div>
  <div id="halo"></div>
  <div id="glow"></div>
  <img id="mark" src="/design/brand/logo/mark-reversed.svg" alt="">
  <img id="wta" src="/design/brand/logo/wordmark-ta-reversed.svg" alt="">
  <div id="wen">Ezhuthu</div>
  <div id="mean">in Tamil, “letter”</div>
  <div id="sub">an apprentice for Tamil epigraphy</div>
  <div class="vignette"></div>
  <div class="src src-r" id="cr">Photo: sunrise over the Vaigai, Madurai, Paulthy, CC BY 2.0</div>
</div>
<script>
const { p, E, $, css, lerp } = EZ;
const A = KIT.photo($('#A'), 'p07');
const g = KIT.grain();
// the mark's triangle (the lamp) sits at about (0.30, 0.66) of the mark box
const TX = 797 + 0.30 * 326, TY = 140 + 0.66 * 224;
window.SCENE = {
  duration: 7.0,
  render(t) {
    g(t);
    KIT.kb(A, [0.10, 0.20, 0.80, 0.74], [0.15, 0.22, 0.75, 0.70], t / 7);
    css($('#A'), { opacity: 0.4 * p(t, 0.0, 1.2, E.linear) });
    // lamp glow from a1-06 drifts to where the mark's lamp will sit and widens
    const m = p(t, 0.1, 1.3, E.standard);
    const gx = lerp(960, TX, m), gy = lerp(540, TY, m);
    const fade = 1 - p(t, 1.6, 0.8);
    css($('#glow'), { left: gx + 'px', top: gy + 'px', opacity: fade,
      boxShadow: `0 0 ${30 + 30 * m}px ${10 + 10 * m}px rgba(245,196,104,.9), 0 0 ${120 + 120 * m}px ${50 + 60 * m}px rgba(234,164,58,.4)` });
    css($('#halo'), { opacity: p(t, 0.4, 1.6), transform: `scale(${0.5 + 0.5 * p(t, 0.4, 2.2)})` });
    // logo: fades only (never scales, rotates or morphs)
    css($('#mark'), { opacity: p(t, 1.4, 0.8, E.linear) });
    css($('#wta'), { opacity: p(t, 3.0, 0.8, E.linear) });
    css($('#wen'), { opacity: p(t, 3.3, 0.8, E.linear) });
    css($('#mean'), { opacity: p(t, 3.9, 0.6, E.linear) });
    const s = p(t, 4.6, 0.6); css($('#sub'), { opacity: s, transform: `translateY(${(1 - s) * 12}px)` });
  },
};
</script></body></html>
